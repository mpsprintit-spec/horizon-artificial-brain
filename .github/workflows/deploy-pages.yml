name: Deploy Horizon Monitor to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitor source
        uses: actions/checkout@v4
        with:
          ref: fix/canonical-brain-mutation-lock
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Verify monitor source
        run: test -f web/monitor/index.html && test -f web/monitor/app.js
      - name: Upload monitor site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/monitor
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
