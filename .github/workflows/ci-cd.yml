name: CI/CD

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Download dependencies
        run: go mod download
      - name: Validate HC-001 foundation
        run: make validate
      - name: Build Go runtime
        run: make build

  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/monitor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          version: 11
          install: false
      - name: Install monitor dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
