name: CI/CD

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Download dependencies
        run: go mod download
      - name: Validate HC-001 foundation
        run: make validate
      - name: Build Go runtime
        run: make build
      - name: Validate nested adapter modules
        run: |
          while IFS= read -r module; do
            (
              cd "$(dirname "$module")"
              go test ./...
            )
          done < <(git ls-files 'services/*/go.mod')
      - name: Race-test runtime and adapter concurrency
        run: go test -race ./services/ai/knowledge ./services/ai/learning ./services/ai/runtime ./services/ai/teaching ./services/ai/bridge ./services/ai/core ./services/ai/cmd/horizon-cli
      - name: Verify and prepare the trained dialogue bundle
        run: |
          python3 -m unittest discover -s scripts -p test_prepare_grounded_dialogue.py
          python3 scripts/prepare_grounded_dialogue.py --state "$RUNNER_TEMP/horizon-dialogue-state"
      - name: Race-test native terminal chat
        run: go test -race ./services/ai/terminal -run '^TestTerminalTranscriptCommandsAndPlainOutput$'
      - name: Build terminal chat for Android arm64
        run: GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/horizon-chat-android-arm64" ./cmd/horizon-chat
      - name: Validate trained language, journal replay and production recovery
        env:
          HORIZON_DIALOGUE_MODEL: ${{ runner.temp }}/horizon-dialogue-state
          HORIZON_DIALOGUE_FINAL_CASES: ${{ runner.temp }}/horizon-dialogue-state/evaluation.json
        run: |
          go test ./services/ai/runtime -run '^TestGroundedDialogue(FreshEvaluation|PersistenceContextAndSynapticAblation)$' -count=1
          go test ./services/ai -run '^TestProductionGroundedDialogueBundle$' -count=1
          go test -race ./services/ai/runtime -run '^TestGroundedDialogueConcurrentCanonicalRead$' -count=1
      - name: Live Bridge integration smoke
        run: make bridge-smoke

  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/monitor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          version: 11
          install: false
      - name: Install monitor dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
