name: Empty Brain Relational Conflict Lab

on:
  push:
    branches:
      - research/relational-conflict-empty-brain-20261111

permissions:
  contents: read

jobs:
  relational-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run empty-brain neural relational experiment
        env:
          HORIZON_RELATIONAL_LAB_ARTIFACT_DIR: ${{ runner.temp }}/horizon-relational-lab
        run: go test -count=1 -v -timeout=8m ./services/ai/runtime -run '^TestRelationalContradictionEmptyBrain$'
      - name: Preserve isolated trained Brain and metrics
        uses: actions/upload-artifact@v4
        with:
          name: horizon-contradiction-brain-seed17
          path: ${{ runner.temp }}/horizon-relational-lab/
          if-no-files-found: error
          retention-days: 30
      - name: Confirm target branch is not main
        run: test "$GITHUB_REF_NAME" = "research/relational-conflict-empty-brain-20261111"
